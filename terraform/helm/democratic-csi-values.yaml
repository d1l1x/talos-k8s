# values/democratic-csi.yaml

csiDriver:
  name: "org.democratic-csi.iscsi"

# The chart defaults both driver images to :latest, so any pod restart
# can silently pull a different build. Pin them.
# NB replace with the current release from
# https://github.com/democratic-csi/democratic-csi/releases
controller:
  driver:
    image:
      tag: v1.9.5

node:
  # Talos-specific — see the Talos section of the democratic-csi README.
  # Talos has no /etc/iscsi; iscsi-tools puts iscsiadm on the host and the
  # container reaches it via nsenter, which needs hostPID.
  hostPID: true
  driver:
    image:
      tag: v1.9.5
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    iscsiDirHostPath: /etc/iscsi
    # Empty type disables kubelet's strict "is a directory" check that
    # currently fails the mount.
    iscsiDirHostPathType: ""

storageClasses:
  - name: truenas-iscsi
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: ext4
    mountOptions: []
    secrets:
      provisioner-secret: {}
      controller-publish-secret: {}
      node-stage-secret: {}
      node-publish-secret: {}
      controller-expand-secret: {}

driver:
  config:
    driver: freenas-api-iscsi # TrueNAS SCALE, API-only — no SSH access required
    httpConnection:
      protocol: https
      host: "${truenas_host}"
      port: 443
      # apiKey set via set_sensitive in democratic-csi.tf, not here
      allowInsecure: true # self-signed TrueNAS cert — set false once you have real TLS on TrueNAS
 
    zfs:
      datasetParentName: "${truenas_dataset_parent}/volumes"
      detachedSnapshotsDatasetParentName: "${truenas_dataset_parent}/snapshots"
 
    iscsi:
      targetPortal: "${truenas_iscsi_portal}"
      interface: ""
      namePrefix: "csi-"
      nameSuffix: ""
      # Required — the driver iterates this when creating the target.
      # IDs come from TrueNAS: Shares > Block Shares (iSCSI) >
      # Portals / Initiators Groups. Usually 1 if they're the first.
      targetGroups:
        - targetGroupPortalGroup: 1
          targetGroupInitiatorGroup: 1
          targetGroupAuthType: None
          targetGroupAuthGroup: null
      extentInsecureTpc: true
      extentXenCompat: false
      extentDisablePhysicalBlocksize: true
      extentBlocksize: 512
      extentRpm: "SSD"
      extentAvailThreshold: 0